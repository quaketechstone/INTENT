<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4b61d1" />
  <meta name="description" content="INTENT-OS Mother" data-i18n-content="mother.shell.html.meta.1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="INTENT-OS" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>INTENT-OS Mother</title>
  <script type="module" crossorigin src="/INTENT/assets/index-128OBWNB.js"></script>
  <link rel="stylesheet" crossorigin href="/INTENT/assets/index-Dr-UlcWh.css">
<link rel="manifest" href="/INTENT/manifest.webmanifest"></head>
<body>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15"/><path d="M12 4.5a7.5 7.5 0 0 0 0 15Z" fill="currentColor" stroke="none" opacity=".55"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8.5 10.5 12 14l3.5-3.5"/><path d="M5 17v1.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V17"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20.5h6"/><path d="M12 16.5v4"/></symbol>
    <symbol id="i-driver" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3.5v3M14.5 3.5v3M9.5 17.5v3M14.5 17.5v3M3.5 9.5h3M3.5 14.5h3M17.5 9.5h3M17.5 14.5h3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6.5v5c0 4.2 3 7.2 7 9 4-1.8 7-4.8 7-9v-5l-7-3Z"/><path d="M9 11.8l2.2 2.2 4-4"/></symbol>
    <symbol id="i-recovery" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3"/><path d="M4 8v4.5h4.5"/></symbol>
  </svg>

  <!-- ============================================================
       内置 Shell（.app-shell）
       可被 Shell Provider 替换：body[data-shell="external"] 时整块隐藏，
       #shellHost 接管。安全界面不在这个子树里（见 #secLayer）。

       Phase 1.2-R：这里**不再有**新建对话 / 搜索对话 / 最近会话 / 模型状态 /
       chat.main 槽位——那些属于 AI 业务，已迁到独立工程。
       ============================================================ -->
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="主导航" data-i18n-aria="mother.shell.html.aria.1">
      <div class="brand-row">
        <div class="brand-mark">Q</div>
        <span class="brand-name">intent<span class="brand-dot">.</span>os</span>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="关闭导航" data-i18n-aria="mother.shell.html.aria.2">×</button>
      </div>
      <!-- 导航由视图注册表渲染（views/index.ts）：加页面只改注册表，不改这里。 -->
      <nav class="nav-section" id="navList" aria-label="功能导航" data-i18n-aria="mother.shell.html.aria.3"></nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="installApp" hidden><svg class="nav-icon" aria-hidden="true"><use href="#i-install"/></svg> <span data-i18n="mother.shell.html.text.1">安装到桌面</span></button>
        <div class="nav-version" id="installAppVersion"></div>
        <div class="nav-version" id="sideFoot"></div>
        <div class="user-mini">
          <div class="avatar" id="statusAvatar">Q</div>
          <div class="user-meta"><strong data-i18n="mother.shell.html.text.2">母体根</strong><span id="statusLine" data-i18n="mother.shell.html.text.3">正在启动母体…</span></div>
          <span class="status-dot" id="statusDot"></span>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="openSidebar" aria-label="打开导航" data-i18n-aria="mother.shell.html.aria.4">☰</button>
          <span class="breadcrumb" id="breadcrumb" data-i18n="mother.shell.html.text.4">控制桌面</span>
        </div>
        <div class="topbar-actions">
          <span class="pill" id="offlinePill" hidden data-i18n="mother.shell.html.text.5">离线</span>
          <button class="icon-btn" id="quickSettings" title="设置" aria-label="设置" data-i18n-title="mother.shell.html.title.1" data-i18n-aria="mother.shell.html.aria.5"><svg class="nav-icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
        </div>
      </header>
      <div class="view-host" id="view" aria-live="polite"></div>
      <!-- 插件渲染区：位于 #view 之外，视图切换不清空。 -->
      <div id="pluginArea"></div>
    </main>
  </div>

  <!-- 第三方 Shell 宿主：与 .app-shell 兄弟。外壳接管时这里显示，内置隐藏。 -->
  <div id="shellHost" data-slot="shell.root"></div>

  <!-- 移动端底部导航（< 900px 显示）。由视图注册表的 tab 项渲染。 -->
  <nav class="tabbar" id="tabbar" aria-label="主导航" data-i18n-aria="mother.shell.html.aria.6">
    <div class="tabbar-inner" id="tabbarInner"></div>
  </nav>

  <!-- 安全层：body 直接子节点，与 .app-shell / #shellHost 平级。
       安全横幅、紧急恢复面板渲染在这里——外壳的 CSS 作用不到（不在同一棵子树）。 -->
  <div class="sec-layer" id="secLayer" aria-live="polite"></div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div id="dialogRoot"></div>
</body>
</html>
